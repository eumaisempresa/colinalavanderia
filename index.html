<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colina Lavanderia - Sistema de Gestão</title>
  <style>
    :root {
      --laranja: #E36A2C;
      --laranja-claro: #FF8A4D;
      --escuro: #1E1206;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--escuro);
      color: #FFF8F0;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .container {
      max-width: 420px;
      padding: 40px 20px;
    }
    .logo {
      font-size: 42px;
      font-weight: 700;
      color: var(--laranja);
      margin-bottom: 10px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 30px;
      color: #FFF8F0;
    }
    .btn {
      display: inline-block;
      background: var(--laranja);
      color: white;
      padding: 18px 40px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      margin: 15px 0;
      width: 100%;
      max-width: 300px;
    }
    .btn:hover {
      background: var(--laranja-claro);
    }
    p {
      opacity: 0.8;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">COLINAS</div>
    <h1>Lavanderia Colinas</h1>
    <p>Sistema de Gestão Simplificado</p>
    
    <a href="login.html" class="btn">Acessar o Sistema</a>
    
    <p style="font-size:14px; margin-top:50px; opacity:0.6;">
      Lavanderia Colinas • Colina de Laranjeiras<br>
      <strong>27 99829-5035</strong>
    </p>
  </div>
</body>
</html>
